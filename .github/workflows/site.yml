name: Site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown==3.7
      - name: Build every page and check languages and links
        run: python3 src/build.py --check
      - name: The committed pages match the sources
        run: git status --porcelain && test -z "$(git status --porcelain)"
